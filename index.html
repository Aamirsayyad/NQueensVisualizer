<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N Queens Visualizer</title>
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <h1>N-Queens Visualizer</h1>
    <div id="container">
        <div id="input">
            <label for="inputNum">Queens : </label>

        </div>
        <p id="error-msg"></p>
        <button id="start-anim" class="hide">Start</button>
        <div id="board">

        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
